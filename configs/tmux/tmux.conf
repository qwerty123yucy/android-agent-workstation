# Touch-friendly tmux configuration for Custom Termux (~/.tmux.conf)
# Enables OSC 8 hyperlinks + dynamic OSC title passthrough + 1:1 line-by-line touch scrolling.

# Terminal capabilities, true color, OSC 8 hyperlinks, and OSC 52 clipboard
set -s default-terminal "tmux-256color"
set -s terminal-features "xterm*:clipboard:ccolour:cstyle:focus:hyperlinks:title:RGB,screen*:title,rxvt*:ignorefkeys"
set -s extended-keys on
set -sg escape-time 10
set -g focus-events on
set -g history-limit 50000
set -g set-clipboard on

# 1-based window & pane indexing with automatic renumbering
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Mouse & touch scrolling (1:1 single-line steps matching Custom Termux scrollback anchoring)
set -g mouse on
bind -T copy-mode    WheelUpPane   select-pane \; send-keys -X -N 1 scroll-up
bind -T copy-mode    WheelDownPane select-pane \; send-keys -X -N 1 scroll-down
bind -T copy-mode-vi WheelUpPane   select-pane \; send-keys -X -N 1 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 1 scroll-down

# Ergonomic splits & shortcuts (preserves default Ctrl+b prefix)
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind m set -g mouse \; display-message "mouse: #{?mouse,on,off}"
bind R source-file ~/.tmux.conf \; display-message "reloaded ~/.tmux.conf"

# Minimal adaptive status bar (transparent background blends cleanly into day/night themes)
set -g status-position bottom
set -g status-style "bg=default,fg=default,dim"
set -g status-left "#[fg=default,nodim,bold][#S] #[default]"
set -g status-left-length 20
set -g status-right "#{?client_prefix,#[fg=default,nodim,bold]^B ,}#{?mouse,,#[fg=default,nodim][mouse:off] }"
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[fg=default,nodim,bold] #I:#W#{?window_zoomed_flag,*,} "
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=default"
set -g message-style "bg=default,fg=default,bold"
set -g mode-style "reverse"
