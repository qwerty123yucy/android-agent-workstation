# Custom Termux recommended configuration (~/.termux/termux.properties)
# Apply changes immediately with: termux-reload-settings

# Theme mode: system (follows Android day/night live without Activity recreation), light, or dark
night-mode = system

# Minimum WCAG contrast rescue for low-contrast TrueColor/256-color text runs.
# Default 2.4 (exempts box-drawing/block/braille graphics and fg==bg fills). Set 1.0 to disable.
terminal-minimum-contrast = 2.4

# Pan the main screen viewport instead of resizing the PTY (no SIGWINCH redraw) when toggling the soft keyboard.
# Alternate screen apps (vim, less, tmux) automatically keep standard PTY resizing.
soft-keyboard-pan-main-screen = true

# Tap OSC 8 hyperlinks or layout-stitched wrapped URLs to open http(s) in browser / copy file:// paths.
terminal-onclick-url-open = true

# Optional: 2-row extra keys with SCROLL lock button (already the built-in default in Custom Termux)
# extra-keys = [['ESC','SHIFT','SCROLL','HOME','UP','END','PGUP'], ['TAB','CTRL','ALT','LEFT','DOWN','RIGHT','PGDN']]
